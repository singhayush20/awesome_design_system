name: awesome_design_system
description: A comprehensive Flutter design system with atomic architecture
version: 0.3.0
publish_to: none

environment:
  sdk: "^3.9.0"
  flutter: ">=3.22.0"

workspace:
  - packages/tokens
  - packages/atoms
  - packages/molecules
  - packages/organisms
  - widgetbook

dependencies:
  awesome_design_system_atoms:
    path: packages/atoms
  awesome_design_system_molecules:
    path: packages/molecules
  awesome_design_system_organisms:
    path: packages/organisms
  awesome_design_system_tokens:
    path: packages/tokens
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  melos: ^6.0.0